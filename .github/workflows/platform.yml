name: Platform validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: ascentiq_test_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d ascentiq_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-password
      PGDATABASE: ascentiq_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: dashboard/requirements*.txt
      - run: pip install -r dashboard/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -B -m dashboard.tests.empty_installation_smoke
      - run: pytest
      - run: python -B -m dashboard.openapi_export --check
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - run: npm ci
        working-directory: dashboard/web
      - run: npm run lint
        working-directory: dashboard/web
      - run: npm run typecheck
        working-directory: dashboard/web
      - run: npm run contracts:check
        working-directory: dashboard/web
      - run: npm test
        working-directory: dashboard/web
      - run: npm run check:styles
        working-directory: dashboard/web
      - run: npm run format:check
        working-directory: dashboard/web
      - run: npm test
        working-directory: dashboard/web
      - run: npm run build
        working-directory: dashboard/web
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard/web
      - run: npm run test:e2e
        working-directory: dashboard/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-playwright-failure
          path: dashboard/web/test-results/
          retention-days: 7
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f dashboard/Dockerfile -t ascentiq-report-test .
      - run: docker run --rm --network none ascentiq-report-test python -B -m unittest discover -s dashboard/tests -p test_report_first_use.py -v
