name: ascentiq
services:
  ollama:
    profiles: ["local-ai"]
    image: ollama/ollama@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 5s
      retries: 10
  db:
    image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_USER: ascentiq_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Configure private database password}
      POSTGRES_DB: ascentiq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascentiq_admin -d ascentiq"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    env_file: .env
    environment:
      ASCENTIQ_AUTO_MIGRATE: "true"
      DASHBOARD_RUNTIME: /app/runtime/dashboard
      DASHBOARD_SCHEDULE_ENABLED: "true"
      GARMIN_MCP_COMMAND: mcp-garmin
      TZ: America/Sao_Paulo
      POSTGRES_ADMIN_PASSWORD: ""
    volumes:
      - ./data:/app/data:ro
      - ./analysis:/app/analysis
      - ./activities:/app/activities:ro
      - ./runtime/dashboard:/app/runtime/dashboard
      - ./runtime/backups:/app/runtime/backups
      - garmin_auth:/home/athlete
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3
  db-tools:
    profiles: ["maintenance"]
    image: ascentiq-api
    env_file: .env
    volumes:
      - ./data:/app/data:ro
      - ./analysis:/app/analysis
      - ./activities:/app/activities:ro
      - ./runtime/dashboard:/app/runtime/dashboard
      - ./runtime/backups:/app/runtime/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["python", "-m", "dashboard.database_cli"]
  frontend:
    build:
      context: .
      dockerfile: dashboard/Dockerfile.web
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_INTERNAL_URL: http://api:8788
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
  web:
    build:
      context: .
      dockerfile: dashboard/Dockerfile.gateway
    ports:
      - "127.0.0.1:8787:80"
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  ollama_models:
  garmin_auth:
  postgres_data:
